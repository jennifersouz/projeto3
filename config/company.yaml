version: '1.0'
id: company
name: Business taxonomy
nature: provisional_business_policy_of_the_team
source: Student Guide, sections "In summary", "R2" and "R3"
classes:
- id: public
  name: Public
  order: 0
  description: Information expressly approved for public disclosure and without non-disclosable sensitive information.
  examples:
  - Published tender notice
  - Report already publicly disclosed
- id: internal_use
  name: Internal Use
  order: 1
  description: Operational information not intended for the public; inappropriate disclosure has limited impact.
  examples:
  - Internal call without sensitive data
  - Routine service note
- id: confidential
  name: Confidential
  order: 2
  description: Personal, financial, clinical, or commercial information requiring access on a need-to-know basis.
  examples:
  - Receipt with identification and IBAN
  - Identifiable clinical result
  - Supplier proposal before award
- id: restricted
  name: Restricted
  order: 3
  description: Especially critical information or highly sensitive secrets whose exposure may cause serious harm.
  examples:
  - Valid access credentials for a critical service
  - Non-public security plan for a critical system
preliminary_rules:
- id: authorized_publication
  signal: public_disclosure_authorized
  effect: allows_public_if_no_sensitive_signals
  observation: The presence on a public portal does not automatically make all content of a similar document public.
- id: iban
  signal: iban_in_non_public_context
  effect: minimum_class
  class: confidential
  observation: Example of a minimum rule suggested in the guide.
- id: health
  signal: identifiable_clinical_data
  effect: minimum_class
  class: confidential
  observation: Rule proposed by the team; a high risk may justify Restricted.
- id: secrets
  signal: access_credentials_or_critical_system_secrets
  effect: minimum_class
  class: restricted
  observation: Proposed rule; never store real secrets in the corpus.
- id: identification
  signal: nif_or_personal_identifiers
  effect: contextual_review
  observation: An isolated NIF is not enough to conclude that the whole document is Confidential; context must be considered.
tie_breaker_criterion: Choose the class with the highest order required by confirmed signals and by the process context;
  when in doubt or low confidence, flag for human review.
initial_class_when_no_context: internal_use
warning: The examples are proposed project policies, not automatic legal rules; Public requires effective indication
  of disclosure and absence of blocking signals.
