versao: '1.0'
id: pnns
nome: Plano Nacional de Nuvem Soberana
sigla_correta: PNNS
fundamento_oficial: Resolução do Conselho de Ministros n.º 102/2026, de 27 de maio, retificada pela Declaração
  de Retificação n.º 22/2026/1, de 19 de junho.
fontes:
- https://diariodarepublica.pt/dr/legislacao-consolidada/resolucao-conselho-ministros/2026-1127305775
- https://diariodarepublica.pt/dr/detalhe/declaracao-retificacao/22-2026-1134399000
- https://digital.gov.pt/pt/estrategia-digital/plano-nacional-nuvem-soberana
dimensoes:
- id: pessoas
  nome: Pessoas e vida humana
  pergunta: O comprometimento do processo, dados ou sistemas pode ameaçar a segurança ou vida de pessoas?
- id: estado
  nome: Estabilidade do Estado
  pergunta: O comprometimento afeta a continuidade e estabilidade das funções do Estado ou serviços públicos?
- id: exposicao
  nome: Exposição de dados
  pergunta: Quais os danos da divulgação indevida da informação suportada pelo processo?
escala_impacto:
- codigo: S
  nome: Sem Impacto
- codigo: M
  nome: Impacto Moderado
- codigo: G
  nome: Impacto Significativo
niveis_oficiais:
- codigo: '0'
  nome: Neutro
- codigo: '1'
  nome: Corrente
- codigo: '2'
  nome: Crítico
- codigo: 3.a
  nome: Estratégico
- codigo: 3.b
  nome: Estratégico (âmbito nacional)
referencial_tecnico:
  estado: nao_localizado_nas_fontes_publicas_consultadas
  data_consulta: '2026-10-24'
  nota: Não localizado não significa oficialmente inexistente. Reconfirmar digital.gov.pt/CNCS/ARTE antes de adoção
    real.
algoritmo:
  tipo: provisorio_nao_oficial
  origem: Guia do Aluno, página 3; hipótese didática
  regras:
  - id: todas_sem_impacto
    g_exatamente: 0
    m_exatamente: 0
    nivel: '0'
  - id: algum_moderado_sem_significativo
    g_exatamente: 0
    m_minimo: 1
    nivel: '1'
  - id: um_significativo
    g_exatamente: 1
    nivel: '2'
  - id: dois_ou_tres_significativos
    g_minimo: 2
    nivel: 3.a
  excecao_3b:
    nivel_base: 3.a
    exige_controle_nacional_explicito: true
    nivel_final: 3.b
    nota: Não inferir controlo nacional por palavras isoladas; definir lista e aprovação humana.
regra_pre_qualificacao: Avaliar o processo de negócio e não apenas o documento. As avaliações ilustrativas por
  categoria em processos.yaml não substituem a futura pré-qualificação de processos CLAV de 2.º nível.
regra_conteudo: A evidência concreta do documento pode elevar cada dimensão (S < M < G), nunca baixá-la abaixo
  do valor herdado do processo.
decisao_final: revisao_humana_em_casos_duvidosos
