[project]
name = "contextiq"
version = "0.1.0"
requires-python = ">=3.13,<3.14"

dependencies = [
    "faker>=40.44.0",
    "pymupdf",
    "python-docx",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
